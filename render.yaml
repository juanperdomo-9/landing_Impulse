# Blueprint de Render: UN solo servicio para toda la web impulsastudiodigital.com.ar
#   /           → la landing (páginas fijas en editor/sitio/, generadas con `python manage.py exportar_sitio`)
#   /editor-ia/ → página de venta del editor
#   /editor     → el editor de video con IA (Next.js)
#
# Uso: Render → New → Blueprint → elegir este repo. Render pide los valores marcados con
# "sync: false" (las claves secretas) antes del primer despliegue.
# Cuando este servicio ande, el servicio viejo de la landing (Django) se puede borrar.

services:
  - type: web
    name: impulsa-web
    runtime: node
    # gratis: se "duerme" tras 15 min sin visitas y la primera vuelve en ~1 minuto
    # (UptimeRobot visitando /editor/api/health cada 5 min lo mantiene despierto).
    # Para que esté siempre encendido sin eso, cambiar a "starter" (unos 7 dólares al mes).
    plan: free
    region: virginia
    rootDir: editor
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /editor/api/health
    autoDeploy: true
    domains:
      - impulsastudiodigital.com.ar
      - www.impulsastudiodigital.com.ar
    envVars:
      - key: NODE_VERSION
        value: "22"
      # dirección pública de la web (el editor vive en /editor)
      - key: NEXT_PUBLIC_SITE_URL
        value: https://impulsastudiodigital.com.ar

      # Plan (mismos valores que hoy)
      - key: PLAN_NAME
        value: Impulsa Studio — Plan mensual
      - key: PLAN_PRICE
        value: "25000"
      - key: PLAN_CURRENCY
        value: ARS
      - key: AI_MONTHLY_LIMIT
        value: "200"
      - key: TRIAL_DAYS
        value: "3"
      - key: TRIAL_AI_LIMIT
        value: "20"

      # Claves secretas: las pasa la socia (están en su proyecto de Vercel)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
