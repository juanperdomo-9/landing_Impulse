<style>
    :root {
        --bg: #0A0F2C;
        --bg-2: #0E1438;
        --bg-footer: #070B22;
        --card: #111842;
        --chat-bg: #0D1336;
        --bubble: #232C6B;
        --text: #F2F0FA;
        --muted: #B9BFE0;
        --muted-2: #C9CDEA;
        --soft: #D6D9F0;
        --dim: #8E95BD;
        --accent: #FF8A1F;
        --sun: #FFC93C;
        --violet: #7A35C9;
        --magenta: #E8456F;
        --ember: #FF7A1A;
        --brand-gradient: linear-gradient(90deg, #7A35C9, #E8456F, #FF7A1A, #FFC93C);
        --ease: cubic-bezier(.22, 1, .36, 1);
        --display: 'Bricolage Grotesque', sans-serif;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
        margin: 0;
        font-family: 'DM Sans', sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow-x: clip;
    }

    img { max-width: 100%; }

    a { color: var(--sun); }
    a:hover { color: #FFE08A; }

    section[id] { scroll-margin-top: 84px; }

    .page { overflow-x: clip; }

    .container {
        max-width: 1280px;
        margin: 0 auto;
        padding-left: 32px;
        padding-right: 32px;
    }

    .display {
        font-family: var(--display);
        font-weight: 800;
        letter-spacing: -0.035em;
        margin: 0;
    }

    .eyebrow-text {
        font-size: 14px;
        letter-spacing: .14em;
        text-transform: uppercase;
        color: var(--sun);
        font-weight: 700;
        margin: 0 0 20px;
    }

    .grad {
        background: linear-gradient(90deg, #9B4DE0, #E8456F, #FF7A1A, #FFC93C, #FF7A1A, #E8456F, #9B4DE0);
        background-size: 200% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        font-style: italic;
        padding-right: .1em;
        animation: shimmer 6s linear infinite;
    }

    /* ---------- BOTONES (animación suave) ---------- */
    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 56px;
        padding: 0 30px;
        border-radius: 999px;
        border: 0;
        font-family: inherit;
        font-weight: 700;
        font-size: 17px;
        text-decoration: none;
        cursor: pointer;
        transition:
            transform .5s var(--ease),
            box-shadow .5s var(--ease),
            background-color .35s ease,
            border-color .35s ease,
            color .35s ease;
    }

    .btn svg { transition: transform .5s var(--ease); }

    .btn:hover { transform: translateY(-3px); }
    .btn:hover svg { transform: translateX(4px); }

    .btn:active {
        transform: translateY(0) scale(.97);
        transition-duration: .15s;
    }

    .btn:focus-visible {
        outline: 2px solid var(--sun);
        outline-offset: 3px;
    }

    .btn-accent {
        background: var(--accent);
        color: var(--bg);
        box-shadow: 0 8px 24px rgba(255, 138, 31, .25);
    }

    .btn-accent:hover {
        color: var(--bg);
        background: #FF9A3D;
        box-shadow: 0 16px 40px rgba(255, 138, 31, .45);
    }

    .btn-ghost {
        background: transparent;
        color: var(--text);
        border: 1.5px solid rgba(255, 255, 255, .3);
    }

    .btn-ghost:hover {
        color: var(--text);
        border-color: var(--sun);
        background: rgba(255, 201, 60, .08);
        box-shadow: 0 12px 30px rgba(0, 0, 0, .25);
    }

    .btn-sm { min-height: 48px; padding: 0 22px; font-size: 15px; }
    .btn-nav { min-height: 44px; padding: 0 22px; font-size: 15px; }
    .btn-lg { min-height: 64px; padding: 0 38px; font-size: 19px; }

    .breathe { animation: breathe 3.4s ease-in-out infinite; }
    .breathe:hover { animation: none; }

    .shiny { position: relative; overflow: hidden; isolation: isolate; }

    .shiny::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 38%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .55), transparent);
        animation: shine 3.8s ease-in-out 2s infinite;
        pointer-events: none;
    }

    /* ---------- BARRA DE PROGRESO ---------- */
    .progress {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        z-index: 60;
        background: var(--brand-gradient);
        transform-origin: left;
        transform: scaleX(0);
    }

    /* ---------- NAVBAR ---------- */
    .site-header {
        position: sticky;
        top: 0;
        z-index: 50;
        border-bottom: 1px solid transparent;
        transition: background-color .4s ease, border-color .4s ease, backdrop-filter .4s ease;
    }

    .site-header.is-scrolled {
        background: rgba(10, 15, 44, .72);
        -webkit-backdrop-filter: blur(16px) saturate(140%);
        backdrop-filter: blur(16px) saturate(140%);
        border-bottom-color: rgba(255, 255, 255, .08);
    }

    .header-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding-top: 22px;
        padding-bottom: 22px;
        transition: padding .45s var(--ease);
    }

    .site-header.is-scrolled .header-inner {
        padding-top: 12px;
        padding-bottom: 12px;
    }

    .logo-chip {
        display: flex;
        flex-shrink: 0;
        background: #fff;
        border-radius: 12px;
        padding: 6px 12px;
        transition: transform .5s var(--ease), box-shadow .5s var(--ease);
    }

    .logo-chip:hover {
        transform: rotate(-2deg) scale(1.03);
        box-shadow: 0 10px 30px rgba(255, 138, 31, .25);
    }

    .logo-chip img {
        height: 34px;
        width: auto;
        display: block;
    }

    .nav-list {
        list-style: none;
        margin: 0;
        padding: 5px;
        display: flex;
        gap: 4px;
        background: rgba(255, 255, 255, .04);
        border: 1px solid rgba(255, 255, 255, .08);
        border-radius: 999px;
    }

    .nav-link {
        display: inline-flex;
        align-items: center;
        min-height: 40px;
        padding: 0 18px;
        border-radius: 999px;
        color: var(--muted-2);
        text-decoration: none;
        font-size: 15px;
        font-weight: 500;
        transition: color .3s ease, background-color .35s ease;
    }

    .nav-link:hover {
        color: #fff;
        background: rgba(255, 255, 255, .07);
    }

    .nav-link.is-active,
    .nav-link.is-active:hover {
        color: var(--bg);
        background: var(--sun);
    }

    .header-actions {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .menu-toggle {
        display: none;
        position: relative;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, .16);
        background: rgba(255, 255, 255, .04);
        cursor: pointer;
        transition: background-color .3s ease, border-color .3s ease;
    }

    .menu-toggle:hover { border-color: var(--sun); }

    .menu-toggle span {
        position: absolute;
        left: 14px;
        right: 14px;
        height: 2px;
        border-radius: 2px;
        background: #fff;
        transition: transform .45s var(--ease), top .45s var(--ease);
    }

    .menu-toggle span:first-child { top: 19px; }
    .menu-toggle span:last-child { top: 27px; }
    .menu-toggle.open span:first-child { top: 23px; transform: rotate(45deg); }
    .menu-toggle.open span:last-child { top: 23px; transform: rotate(-45deg); }

    .mobile-menu {
        position: fixed;
        inset: 0;
        z-index: 40;
        padding: 120px 24px 40px;
        display: flex;
        flex-direction: column;
        gap: 36px;
        overflow-y: auto;
        background: rgba(10, 15, 44, .97);
        -webkit-backdrop-filter: blur(16px);
        backdrop-filter: blur(16px);
        opacity: 0;
        visibility: hidden;
        transition: opacity .4s ease, visibility 0s linear .4s;
    }

    .mobile-menu.open {
        opacity: 1;
        visibility: visible;
        transition: opacity .4s ease;
    }

    .mm-list {
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .mm-link,
    .mm-cta {
        opacity: 0;
        transform: translateY(24px);
        transition: opacity .5s ease, transform .6s var(--ease), color .3s ease;
    }

    .mm-link {
        display: flex;
        align-items: baseline;
        gap: 16px;
        padding: 16px 0;
        border-bottom: 1px solid rgba(255, 255, 255, .08);
        color: #fff;
        text-decoration: none;
        font-family: var(--display);
        font-weight: 800;
        font-size: clamp(34px, 9vw, 52px);
        letter-spacing: -0.03em;
    }

    .mm-link:hover { color: var(--sun); }

    .mm-link span {
        font-family: 'DM Sans', sans-serif;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: .1em;
        color: var(--sun);
    }

    .mobile-menu.open .mm-link,
    .mobile-menu.open .mm-cta {
        opacity: 1;
        transform: none;
    }

    .mobile-menu.open li:nth-child(1) .mm-link { transition-delay: .08s; }
    .mobile-menu.open li:nth-child(2) .mm-link { transition-delay: .14s; }
    .mobile-menu.open li:nth-child(3) .mm-link { transition-delay: .2s; }
    .mobile-menu.open li:nth-child(4) .mm-link { transition-delay: .26s; }
    .mobile-menu.open li:nth-child(5) .mm-link { transition-delay: .32s; }
    .mobile-menu.open .mm-cta { transition-delay: .4s; }

    .mm-cta { align-self: flex-start; }

    /* ---------- HERO ---------- */
    .hero {
        position: relative;
        max-width: 1280px;
        margin: 0 auto;
        padding: 56px 32px 150px;
    }

    .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(70px);
        pointer-events: none;
        animation: drift 18s ease-in-out infinite;
    }

    .orb-1 { width: 520px; height: 520px; left: -220px; top: -120px; background: rgba(122, 53, 201, .42); }
    .orb-2 { width: 600px; height: 600px; right: -200px; top: 120px; background: rgba(255, 122, 26, .22); animation-delay: -7s; }

    .hero-art {
        position: absolute;
        right: -60px;
        top: 0;
        width: min(66%, 900px);
        height: auto;
        z-index: 0;
    }

    .curve {
        stroke-dasharray: 1400;
        stroke-dashoffset: 1400;
        animation: draw 2.4s cubic-bezier(.6, .05, .2, 1) .5s forwards;
    }

    .tip { opacity: 0; animation: fade .35s ease 2.7s forwards; }

    .bar {
        transform-box: fill-box;
        transform-origin: bottom;
        animation: rise 1.2s var(--ease) both;
    }

    .dot { animation: float 5s ease-in-out infinite; }

    .hero-content {
        position: relative;
        z-index: 1;
        max-width: 880px;
    }

    .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 16px;
        border: 1px solid rgba(255, 255, 255, .14);
        border-radius: 999px;
        font-size: 14px;
        color: var(--soft);
        background: rgba(10, 15, 44, .6);
    }

    .hero-title {
        font-size: clamp(54px, 8.4vw, 132px);
        line-height: .96;
        letter-spacing: -0.04em;
        margin: 30px 0;
    }

    .w {
        display: inline-block;
        opacity: 0;
        animation: up .9s var(--ease) forwards;
    }

    .fu {
        opacity: 0;
        animation: up .9s var(--ease) forwards;
    }

    .hero-sub {
        max-width: 560px;
        font-size: 20px;
        line-height: 1.6;
        color: var(--muted);
        margin: 0 0 40px;
    }

    .hero-ctas {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
    }

    /* ---------- MARQUEE ---------- */
    .marquee {
        background: var(--sun);
        color: var(--bg);
        transform: rotate(-2deg);
        margin: 0 -40px;
        padding: 22px 0;
        overflow: hidden;
    }

    .track {
        display: flex;
        gap: 48px;
        width: max-content;
        align-items: center;
        font-family: var(--display);
        font-weight: 800;
        font-size: 34px;
        letter-spacing: -0.01em;
        text-transform: uppercase;
        white-space: nowrap;
        animation: marquee 32s linear infinite;
    }

    /* ---------- SERVICIOS ---------- */
    .services { padding-top: 150px; padding-bottom: 80px; }

    .section-head {
        display: flex;
        flex-wrap: wrap;
        gap: 32px;
        align-items: flex-end;
        justify-content: space-between;
        margin-bottom: 56px;
    }

    .section-head h2 {
        font-size: clamp(42px, 5.4vw, 80px);
        line-height: .98;
        max-width: 640px;
    }

    .section-head p {
        max-width: 420px;
        font-size: 18px;
        line-height: 1.6;
        color: var(--muted);
        margin: 0;
    }

    .services-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr));
        gap: 24px;
    }

    .services-grid > .reveal { display: flex; }

    .svc {
        flex: 1 1 auto;
        background: var(--card);
        border: 1px solid rgba(255, 255, 255, .08);
        border-radius: 28px;
        padding: 40px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        transition: transform .5s var(--ease), border-color .4s ease, box-shadow .5s var(--ease);
    }

    .svc:hover {
        transform: translateY(-8px);
        border-color: rgba(255, 201, 60, .5);
        box-shadow: 0 24px 60px rgba(232, 69, 111, .2);
    }

    .svc-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
    }

    .num {
        font-family: var(--display);
        font-weight: 800;
        font-size: 88px;
        line-height: .8;
        color: transparent;
        -webkit-text-stroke: 1.5px rgba(255, 255, 255, .4);
        transition: -webkit-text-stroke-color .35s ease;
    }

    .svc:hover .num { -webkit-text-stroke-color: var(--sun); }

    .meter {
        display: flex;
        gap: 5px;
        align-items: flex-end;
        height: 40px;
    }

    .meter span {
        width: 9px;
        border-radius: 3px;
        background: rgba(255, 255, 255, .12);
    }

    .meter span:nth-child(1) { height: 14px; }
    .meter span:nth-child(2) { height: 22px; }
    .meter span:nth-child(3) { height: 30px; }
    .meter span:nth-child(4) { height: 40px; }

    .meter .on-1 { background: #E8456F; }
    .meter .on-2 { background: #F5603F; }
    .meter .on-3 { background: #FF8A1F; }
    .meter .on-4 { background: #FFC93C; }

    .svc h3 {
        font-family: var(--display);
        font-weight: 700;
        font-size: 32px;
        letter-spacing: -0.02em;
        margin: 0;
    }

    .svc p {
        font-size: 17px;
        line-height: 1.65;
        color: var(--muted);
        margin: 0;
    }

    .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }

    .tags span {
        font-size: 13px;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, .06);
        color: var(--soft);
    }

    .svc-links {
        margin-top: auto;
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
    }

    .card-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        font-weight: 700;
        text-decoration: none;
        position: relative;
    }

    .card-link::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 8px;
        height: 2px;
        width: 0;
        border-radius: 2px;
        background: currentColor;
        transition: width .5s var(--ease);
    }

    .card-link:hover::after { width: calc(100% - 26px); }
    .card-link svg { transition: transform .5s var(--ease); }
    .card-link:hover svg { transform: translateX(5px); }
    .card-link.muted { color: var(--muted-2); }
    .card-link.muted:hover { color: #fff; }

    /* ---------- EDITOR CON IA ---------- */
    .editor { padding-top: 40px; padding-bottom: 40px; }

    .editor-card {
        position: relative;
        overflow: hidden;
        display: flex;
        flex-wrap: wrap;
        gap: 56px;
        align-items: center;
        padding: 64px;
        border-radius: 36px;
        border: 1px solid rgba(255, 255, 255, .08);
        background:
            radial-gradient(circle at 88% 15%, rgba(255, 122, 26, .16), transparent 45%),
            radial-gradient(circle at 8% 92%, rgba(122, 53, 201, .26), transparent 50%),
            var(--card);
    }

    .editor-copy { flex: 1 1 440px; min-width: 0; }

    .badge-new {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        margin-bottom: 22px;
        border-radius: 999px;
        background: var(--sun);
        color: var(--bg);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: .08em;
        text-transform: uppercase;
    }

    .editor-copy h2 {
        font-size: clamp(42px, 5.4vw, 80px);
        line-height: .95;
        letter-spacing: -0.04em;
        margin-bottom: 24px;
    }

    .editor-copy .lead {
        font-size: 19px;
        line-height: 1.6;
        color: var(--muted);
        margin: 0 0 28px;
        max-width: 520px;
    }

    .editor-ctas {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 36px;
    }

    .editor-note {
        margin: 16px 0 0;
        font-size: 14px;
        color: var(--dim);
    }

    .editor-visual {
        position: relative;
        flex: 1 1 360px;
        min-width: 0;
        display: flex;
        justify-content: center;
        padding: 24px 0;
    }

    .phone {
        position: relative;
        width: min(290px, 78%);
        aspect-ratio: 9 / 16;
        padding: 10px;
        border-radius: 40px;
        background: #05081C;
        border: 1px solid rgba(255, 255, 255, .12);
        box-shadow: 0 40px 90px rgba(0, 0, 0, .5), 0 0 0 6px rgba(255, 255, 255, .03);
    }

    .phone-screen {
        position: relative;
        height: 100%;
        overflow: hidden;
        border-radius: 31px;
        background: linear-gradient(160deg, #2A1458 0%, #6E2A73 42%, #E8456F 74%, #FF8A1F 100%);
    }

    .reel-bar {
        position: absolute;
        top: 16px;
        left: 14px;
        right: 14px;
        display: flex;
        gap: 4px;
    }

    .reel-bar span {
        flex: 1;
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, .35);
    }

    .reel-bar span:first-child { background: #fff; }

    .logo-tag {
        position: absolute;
        top: 32px;
        right: 14px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 10px;
        background: #fff;
        color: var(--bg);
        font-family: var(--display);
        font-weight: 800;
        font-size: 12px;
    }

    .phone-bars {
        position: absolute;
        left: 50%;
        top: 30%;
        transform: translateX(-50%);
        display: flex;
        gap: 12px;
        align-items: flex-end;
        opacity: .28;
    }

    .phone-bars span { width: 34px; border-radius: 8px 8px 0 0; background: #fff; }
    .phone-bars span:nth-child(1) { height: 60px; }
    .phone-bars span:nth-child(2) { height: 100px; }
    .phone-bars span:nth-child(3) { height: 140px; }

    .subs {
        position: absolute;
        left: 14px;
        right: 14px;
        bottom: 22%;
        margin: 0;
        text-align: center;
        font-family: var(--display);
        font-weight: 800;
        font-size: 23px;
        line-height: 1.2;
        text-transform: uppercase;
        color: #fff;
        text-shadow: 0 2px 0 rgba(0, 0, 0, .35);
    }

    .subs .k {
        display: inline-block;
        animation: karaoke 4.8s infinite;
    }

    .subs .k:nth-child(2) { animation-delay: .8s; }
    .subs .k:nth-child(3) { animation-delay: 1.6s; }
    .subs .k:nth-child(4) { animation-delay: 2.4s; }
    .subs .k:nth-child(5) { animation-delay: 3.2s; }
    .subs .k:nth-child(6) { animation-delay: 4s; }

    .prompt-bubble {
        position: absolute;
        z-index: 2;
        top: 6%;
        left: 0;
        max-width: 250px;
        padding: 14px 16px;
        border-radius: 20px 20px 20px 6px;
        background: var(--bubble);
        color: var(--text);
        font-size: 14px;
        line-height: 1.45;
        box-shadow: 0 20px 50px rgba(0, 0, 0, .4);
        animation: float 6s ease-in-out infinite;
    }

    .prompt-who {
        display: block;
        margin-bottom: 4px;
        font-size: 12px;
        font-weight: 700;
        color: var(--sun);
    }

    .result-chips {
        position: absolute;
        z-index: 2;
        right: 0;
        top: 36%;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
    }

    .result-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(10, 15, 44, .88);
        border: 1px solid rgba(255, 255, 255, .14);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        font-size: 13px;
        font-weight: 700;
        color: var(--text);
    }

    .js .reveal .result-chip {
        opacity: 0;
        transform: translateX(16px);
        transition: opacity .6s ease, transform .7s var(--ease);
    }

    .js .reveal.in .result-chip { opacity: 1; transform: none; }
