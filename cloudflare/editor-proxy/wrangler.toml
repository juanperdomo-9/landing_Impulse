# Puente de Cloudflare para servir el editor en impulsastudiodigital.com.ar/editor
# Publicar: Cloudflare → Workers & Pages → Create → pegar worker.js (o "npx wrangler deploy" en esta carpeta).

name = "impulsa-editor-proxy"
main = "worker.js"
compatibility_date = "2026-11-01"

routes = [
  { pattern = "impulsastudiodigital.com.ar/editor*", zone_name = "impulsastudiodigital.com.ar" },
  { pattern = "www.impulsastudiodigital.com.ar/editor*", zone_name = "impulsastudiodigital.com.ar" },
]

[vars]
# Dirección que Render le da al servicio del editor (Render → impulsa-editor → arriba a la izquierda)
EDITOR_ORIGIN = "https://impulsa-editor.onrender.com"
